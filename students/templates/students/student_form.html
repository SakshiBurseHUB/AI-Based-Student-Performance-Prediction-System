<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
</head>

<body>

    <h1>Student Performance System</h1>

    <h2>Add Student</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Student ID:</label><br>
        <input type="text" name="student_id" required>
        <br><br>

        <label>Name:</label><br>
        <input type="text" name="name" required>
        <br><br>

        <label>Attendance (%):</label><br>
        <input type="number" name="attendance" step="0.01" min="0" max="100" required>
        <br><br>

        <label>Study Hours:</label><br>
        <input type="number" name="study_hours" step="0.01" min="0" required>
        <br><br>

        <label>Previous Marks:</label><br>
        <input type="number" name="previous_marks" step="0.01" min="0" max="100" required>
        <br><br>

        <label>Assignment Marks:</label><br>
        <input type="number" name="assignment_marks" step="0.01" min="0" max="100" required>
        <br><br>

        <label>Internal Marks:</label><br>
        <input type="number" name="internal_marks" step="0.01" min="0" max="100" required>
        <br><br>

        <button type="submit">Add Student</button>

    </form>

    <br>

    <a href="{% url 'students:student_list' %}">
        Back to Student List
    </a>

</body>
</html>
